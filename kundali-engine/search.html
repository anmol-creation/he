<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Astronomical Search | Sanatan Archive</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111111;
            color: var(--vault-text-main);
            font-family: 'Work Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .vault-topbar { width: 100%; }

        .container {
            max-width: 900px;
            width: 90%;
            margin: 4rem auto;
            padding: 2.5rem;
            background-color: var(--vault-surface);
            border: 1px solid var(--vault-border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .title {
            font-family: 'EB Garamond', serif;
            font-size: 2.5rem;
            color: var(--vault-accent);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: var(--vault-text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--vault-text-muted);
            font-weight: 500;
        }

        input[type="number"], select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--vault-border);
            background-color: #000;
            color: var(--vault-text-main);
            border-radius: 4px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--vault-primary);
            box-shadow: 0 0 5px rgba(204, 106, 0, 0.5);
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            background-color: var(--vault-primary);
            color: #fff;
            border: 1px solid var(--vault-accent);
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--vault-accent);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            border: 1px dashed var(--vault-accent);
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.4);
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 1.1rem;
            display: none;
            color: var(--vault-text-main);
            line-height: 1.5;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header class="vault-topbar">
        <a href="index.html" class="vault-brand" style="text-decoration: none;">
            <span style="font-size: 1.5rem; margin-right: 10px;">←</span>
            <span>Kundali Engine</span>
        </a>
    </header>

    <div class="container">
        <h1 class="title">Astronomical Search</h1>
        <p class="subtitle">Search historical dates based on celestial events and Tithis (Reverse Ephemeris)</p>

        <div class="grid-2">
            <div class="form-group">
                <label for="startYear">Start Year (e.g., -5000 for 5000 BCE)</label>
                <input type="number" id="startYear" value="-3000">
            </div>
            <div class="form-group">
                <label for="endYear">End Year (e.g., -1000)</label>
                <input type="number" id="endYear" value="-2000">
            </div>
        </div>

        <div class="form-group">
            <label for="tithiSelect">Target Tithi (Optional)</label>
            <select id="tithiSelect">
                <option value="any">-- Any Tithi --</option>
                <option value="15">Shukla Purnima (Full Moon)</option>
                <option value="30">Krishna Amavasya (New Moon)</option>
                <option value="9">Shukla Navami (e.g., Ram Navami)</option>
                <option value="8">Krishna Ashtami (e.g., Janmashtami)</option>
            </select>
        </div>

        <button id="searchBtn">Start Historical Search</button>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script src="search.js"></script>
</body>
</html>
