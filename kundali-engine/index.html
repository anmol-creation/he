<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundali Engine | Sanatan Archive</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        .yoga-card {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--vault-border);
            border-left: 4px solid var(--vault-accent);
            border-radius: 6px;
            padding: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .yoga-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-left-color: var(--vault-primary);
        }

        .yoga-card.dosha {
            border-left-color: #ff4444;
        }

        .yoga-card.dosha:hover {
            border-left-color: #ff0000;
        }

        .yoga-icon {
            font-size: 2rem;
            color: var(--vault-accent);
            flex-shrink: 0;
            margin-top: 0.2rem;
        }

        .yoga-card.dosha .yoga-icon {
            color: #ff4444;
        }

        .yoga-content {
            flex: 1;
        }

        .yoga-title {
            font-family: 'EB Garamond', serif;
            font-size: 1.5rem;
            color: var(--vault-text-main);
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .yoga-badge {
            font-family: 'Work Sans', sans-serif;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            background-color: rgba(204, 106, 0, 0.2);
            color: var(--vault-primary);
            border: 1px solid var(--vault-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .yoga-card.dosha .yoga-badge {
            background-color: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border-color: #ff4444;
        }

        .yoga-desc {
            color: var(--vault-text-muted);
            line-height: 1.6;
            margin: 0;
            font-size: 1rem;
        }


        /* Language Toggle Styles */
        .lang-toggle-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 1rem;
            gap: 0.5rem;
            color: var(--vault-text-muted);
            font-family: 'Work Sans', sans-serif;
            font-size: 0.9rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(204, 106, 0, 0.3);
            transition: .4s;
            border: 1px solid var(--vault-accent);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--vault-primary);
            transition: .4s;
        }

        input:checked + .slider {
            background-color: rgba(204, 106, 0, 0.6);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #fff;
        }

        .slider.round {
            border-radius: 24px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        body {
            background-color: #111111;
            color: var(--vault-text-main);
            font-family: 'Work Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .vault-topbar {
            width: 100%;
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 4rem auto;
            padding: 2.5rem;
            background-color: var(--vault-surface);
            border: 1px solid var(--vault-border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .title {
            font-family: 'EB Garamond', serif;
            font-size: 2.5rem;
            color: var(--vault-accent);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: var(--vault-text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--vault-text-muted);
            font-weight: 500;
        }

        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--vault-border);
            background-color: #000;
            color: var(--vault-text-main);
            border-radius: 4px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--vault-primary);
            box-shadow: 0 0 5px rgba(204, 106, 0, 0.5);
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            background-color: var(--vault-primary);
            color: #fff;
            border: 1px solid var(--vault-accent);
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--vault-accent);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            border: 1px dashed var(--vault-accent);
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.4);
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 1.1rem;
            display: none;
            color: var(--vault-text-main);
            line-height: 1.5;
        }

        /* Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chartSection {
            animation: slideUpFade 0.6s ease-out;
        }

        .yoga-card {
            animation: slideUpFade 0.5s ease-out backwards;
        }

        .yoga-card:nth-child(1) { animation-delay: 0.1s; }
        .yoga-card:nth-child(2) { animation-delay: 0.2s; }
        .yoga-card:nth-child(3) { animation-delay: 0.3s; }
        .yoga-card:nth-child(4) { animation-delay: 0.4s; }
        .yoga-card:nth-child(5) { animation-delay: 0.5s; }

        .chart-style-btn {
            background-color: var(--vault-surface);
            color: var(--vault-text-muted);
            border: 1px solid var(--vault-border);
            padding: 0.5rem 1rem;
            margin: 0 0.2rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            width: auto;
            display: inline-block;
            transition: all 0.2s;
        }
        .chart-style-btn.active {
            background-color: var(--vault-primary);
            color: #000;
            border-color: var(--vault-accent);
        }
        .chart-style-btn:hover {
            background-color: rgba(204, 106, 0, 0.2);
            color: var(--vault-primary);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar (Matches Vault Theme) -->
    <header class="vault-topbar">
        <a href="../index.html" class="vault-brand" style="text-decoration: none;">
            <span style="font-size: 1.5rem; margin-right: 10px;">←</span>
            <span>Sanatan Archive</span>
        </a>
    </header>

    <div class="container">

        <div class="lang-toggle-container">
            <span id="lang-en-label" style="opacity: 0.5;">English</span>
            <label class="switch">
                <input type="checkbox" id="langToggle" checked>
                <span class="slider round"></span>
            </label>
            <span id="lang-hi-label" style="color: var(--vault-accent); font-weight: bold;">हिंदी</span>
        </div>

        <h1 class="title" id="mainTitle">Kundali Engine</h1>
        <p class="subtitle" id="subTitle">स्विस एफेमेरिस (Swiss Ephemeris) का उपयोग कर उन्नत ज्योतिषीय गणना</p>

        <div class="form-group" style="margin-bottom: 2rem;">
            <label for="quickSave" id="quickSaveLabel">त्वरित कुंडलियां (Quick Saves)</label>
            <select id="quickSave" style="width: 100%; padding: 0.8rem; background: var(--vault-surface); border: 1px solid var(--vault-border); color: var(--vault-accent); border-radius: 4px; font-family: 'Cinzel', serif;">
                <option value="none">-- चुनें --</option>
                <option value="ram">भगवान राम (Lord Ram)</option>
                <option value="krishna">भगवान कृष्ण (Lord Krishna)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name" id="nameLabel">नाम</label>
            <input type="text" id="name" placeholder="नाम दर्ज करें">
        </div>

        <div class="form-group" style="display: flex; gap: 1rem;">
            <div style="flex: 1;">
                <label for="dob" id="dobLabel">जन्म तिथि</label>
                <input type="text" id="dob" value="1999-12-22" placeholder="YYYY-MM-DD (उदा. -5114-01-10)">
            </div>
            <div style="flex: 1;">
                <label for="time" id="timeLabel">जन्म समय</label>
                <input type="time" id="time" value="20:45">
            </div>
        </div>

        <div class="form-group">
            <label for="city" id="cityLabel">जन्म स्थान (शहर)</label>
            <input type="text" id="city" value="Pilibhit, India" placeholder="उदा., अयोध्या, भारत">
        </div>

        <div class="form-group">
            <label for="patra" id="patraLabel">पात्र (वर्तमान जीवन स्थिति / Identity)</label>
            <select id="patra" style="width: 100%; padding: 0.8rem; background: var(--vault-surface); border: 1px solid var(--vault-border); color: var(--vault-text); border-radius: 4px; font-family: 'Cinzel', serif;">
                <option value="student">विद्यार्थी / अभी सीख रहा हूँ (Student/Learner)</option>
                <option value="struggling_hustler" selected>संघर्षरत / खुद का कुछ कर रहा हूँ (Struggling Hustler/Founder)</option>
                <option value="job_employee">नौकरीपेशा / जॉब (9-to-5 Employee)</option>
                <option value="established_business">स्थापित व्यापारी (Established Businessman)</option>
            </select>
        </div>



        <div id="chartSection" style="display: none; margin-top: 2rem; text-align: center;">
            <div style="margin-bottom: 1rem;">
                <button id="btnNorthStyle" class="chart-style-btn active">North Indian</button>
                <button id="btnSouthStyle" class="chart-style-btn">South Indian</button>
            </div>
            <div id="kundaliSvgContainer" style="width: 100%; max-width: 400px; height: 400px; margin: 0 auto; background: var(--vault-surface); border: 1px solid var(--vault-border); border-radius: 8px;"></div>
        </div>

        <button id="calculateBtn">कुण्डली डेटा जनरेट करें</button>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="search.html" id="searchLink" style="color: var(--vault-accent); text-decoration: none; font-size: 0.9rem; border-bottom: 1px dotted var(--vault-accent);">ऐतिहासिक खगोलीय खोज पर जाएँ →</a>
        </div>

        <div id="resultBox" class="result-box"></div>


        <div id="yogaContainer" style="display: none; margin-top: 2rem;">

            <div id="chartStatsBox" style="background: var(--vault-surface); border: 1px solid var(--vault-accent); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; text-align: center;">
                <h3 id="chartTierLabel" style="color: var(--vault-accent); font-size: 1.8rem; margin-bottom: 0.5rem; font-family: 'Cinzel', serif;">S-Tier</h3>
                <p id="chartTierTitle" style="color: var(--vault-text); font-size: 1.1rem; margin-bottom: 1rem;">महा-राजयोग</p>
                <div style="display: flex; justify-content: center; gap: 2rem; font-size: 0.9rem; color: var(--vault-text-muted);">
                    <div><span style="color: #4ade80;">राजयोग पावर:</span> <span id="statRajyoga">0</span></div>
                    <div><span style="color: #f87171;">दोष पावर:</span> <span id="statDosha">0</span></div>
                    <div><span style="color: #60a5fa;">दुर्लभता (Rarity):</span> <span id="statRarity">0</span></div>
                </div>
                <div id="patraReading" style="margin-top: 1rem; font-style: italic; color: var(--vault-text-muted); font-size: 0.95rem; border-top: 1px solid var(--vault-border); padding-top: 1rem;">
                    <!-- Contextual reading based on Patra goes here -->
                </div>
            </div>

            <h2 class="title" id="yogaTitle" style="font-size: 2rem; margin-bottom: 1.5rem;">योग और दोष विश्लेषण</h2>
            <div id="yogaList" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Yoga items will be injected here dynamically -->
            </div>

            <h2 class="title" id="bhaavPhalTitle" style="font-size: 2rem; margin-top: 3rem; margin-bottom: 1.5rem;">भाव फल (House Results)</h2>
            <div id="bhaavPhalList" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- House specific results will be injected here dynamically -->
            </div>
        </div>
    </div>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="app.js"></script>
</body>
</html>
