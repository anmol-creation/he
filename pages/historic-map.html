<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संपूर्ण सनातन इतिहास | Historic Map</title>
    <meta name="description" content="Interactive Infinite Canvas of Sanatan History">
    <meta name="theme-color" content="#FF6B35">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/historic-map.css">
<link rel="icon" type="image/jpeg" href="../icons/logo.jpg">
    </head>
<body>
    <!-- Floating Controls (Top-Right) -->
    <div id="floating-controls-top" class="floating-controls">
        <div class="search-container floating-btn-group">
            <button id="search-toggle-btn" class="floating-btn" title="Search">🔍</button>
            <input type="text" id="map-search-input" class="search-bar collapsed" placeholder="Search Entity..." autocomplete="off">
            <div id="map-search-results" class="search-results-dropdown"></div>
        </div>
        <button id="map-view-btn" class="floating-btn" title="Map View / Filters">🗺️</button>
    </div>

    <!-- Floating Controls (Bottom-Right) -->
    <div id="floating-controls-bottom" class="floating-controls">
        <button id="zoom-in-btn" class="floating-btn" title="Zoom In">➕</button>
        <button id="zoom-out-btn" class="floating-btn" title="Zoom Out">➖</button>
    </div>

    <!-- Bottom Navigation Bar (Footer) -->
    <nav id="bottom-nav-bar">
        <a href="itihas-puran.html" class="nav-btn" title="Back">⬅</a>

        <!-- Legend Dots -->
        <div id="map-legend-container" style="display: flex; gap: 10px; align-items: center; position: relative;">
            <div class="legend-dot" data-desc="सूर्यवंश (Suryavansh Lineage)" style="background-color: #FF9900; width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 2px solid white;"></div>
            <div class="legend-dot" data-desc="चंद्रवंश (Chandravansh Lineage)" style="background-color: #4169E1; width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 2px solid white;"></div>
            <div class="legend-dot" data-desc="पत्नी (Wife Node & Connection)" style="background-color: #ff99cc; width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 2px solid white;"></div>
            <div class="legend-dot" data-desc="पुत्री (Daughter Node)" style="background-color: #ffb6c1; width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 2px solid white;"></div>
            <div class="legend-dot" data-desc="विवाह (Marriage Transition Wire)" style="background-color: transparent; width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 2px dashed red;"></div>

            <!-- Legend Popup -->
            <div id="legend-popup" style="display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(34,34,34,0.95); padding: 10px 15px; border-radius: 8px; border: 1px solid #FF6B35; color: white; white-space: nowrap; font-size: 0.9rem; z-index: 300;">
                <span id="legend-text">Legend</span>
            </div>
        </div>

        <a href="../index.html" class="nav-btn" title="Home">🏠</a>
    </nav>



    <!-- Fixed River of Time (Left Sidebar) -->
    <aside id="river-of-time">
        <!-- Time markers dynamically injected here by JS -->
    </aside>

    <!-- Map Area (Infinite Canvas) -->
    <main id="map-container">
        <div id="map-canvas">
            <svg id="connection-lines" preserveAspectRatio="none"></svg>
            <div id="nodes-container">
                <!-- Nodes dynamically injected here by JS -->
            </div>
        </div>
    </main>

    <!-- Focus Node Pop-up/Panel (Hidden by default) -->
    <div id="focus-panel" class="hidden">
        <button id="close-panel">✕</button>
        <div class="panel-header" id="panel-header">
            <div class="panel-dots" id="panel-dots"></div>
            <h2 id="panel-name">Name</h2>
            <p id="panel-subtitle" class="panel-subtitle">Subtitle</p>
        </div>
        <div class="panel-tabs">
            <button class="tab-btn active" data-tab="parichay">परिचय</button>
            <button class="tab-btn" data-tab="jeevan">जीवन</button>
            <button class="tab-btn" data-tab="kathayein">कथाएँ</button>
        </div>
        <div class="panel-content" id="panel-content-area">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Data Files -->
    <script type="module" src="../js/data/historic-data.js"></script>
    <!-- Core Engine -->
    <script src="../js/layout-engine.js"></script>
    <script src="../js/historic-map.js"></script>
</body>
</html>
