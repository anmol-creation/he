<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संपूर्ण सनातन इतिहास | Historic Map</title>
    <meta name="description" content="Interactive Infinite Canvas of Sanatan History">
    <meta name="theme-color" content="#FF6B35">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/historic-map.css">
</head>
<body>
    <header style="position: absolute; top: 0; left: 0; width: 100%; z-index: 100; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px);">
        <div class="header-content" style="display: flex; align-items: center; width: 100%; padding: 0 15px;">
            <a href="itihas-puran.html">← Back</a>
            <span class="header-separator" style="margin: 0 10px;">|</span>
            <span>संपूर्ण सनातन इतिहास</span>

            <!-- Search Bar Container -->
            <div id="map-search-container" style="position: relative; margin-left: 20px; flex-grow: 1; max-width: 300px;">
                <input type="text" id="map-search-input" placeholder="Search Entity..." style="width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid #ccc; font-family: 'Poppins', sans-serif; font-size: 14px; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <div id="map-search-suggestions" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 5px; max-height: 300px; overflow-y: auto; z-index: 1000; display: none; border: 1px solid #eee;">
                    <!-- Suggestions will be injected here -->
                </div>
            </div>

            <div style="margin-left: auto; display: flex; gap: 10px;">
                <button id="zoom-out-btn" class="map-control-btn">- Zoom</button>
                <button id="zoom-in-btn" class="map-control-btn">+ Zoom</button>
            </div>
        </div>
    </header>

    <!-- Fixed River of Time (Left Sidebar) -->
    <aside id="river-of-time">
        <!-- Time markers dynamically injected here by JS -->
    </aside>

    <!-- Map Area (Infinite Canvas) -->
    <main id="map-container">
        <div id="map-canvas">
            <svg id="connection-lines" preserveAspectRatio="none"></svg>
            <div id="nodes-container">
                <!-- Nodes dynamically injected here by JS -->
            </div>
        </div>
    </main>

    <!-- Focus Node Pop-up/Panel (Hidden by default) -->
    <div id="focus-panel" class="hidden">
        <button id="close-panel">✕</button>
        <div class="panel-header" id="panel-header">
            <div class="panel-dots" id="panel-dots"></div>
            <h2 id="panel-name">Name</h2>
            <p id="panel-subtitle" class="panel-subtitle">Subtitle</p>
        </div>
        <div style="padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: center;">
            <button id="show-lineage-btn" style="background: linear-gradient(135deg, var(--primary-saffron) 0%, var(--secondary-gold) 100%); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 5px rgba(255,107,53,0.3); transition: transform 0.2s;">
                पर ब्रह्म तक वंश देखें (Show Lineage)
            </button>
        </div>
        <div class="panel-tabs">
            <button class="tab-btn active" data-tab="parichay">परिचय</button>
            <button class="tab-btn" data-tab="jeevan">जीवन</button>
            <button class="tab-btn" data-tab="kathayein">कथाएँ</button>
        </div>
        <div class="panel-content" id="panel-content-area">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Data Files -->
    <script src="../js/data/historic-data.js"></script>
    <!-- Core Engine -->
    <script src="../js/historic-map.js"></script>
</body>
</html>
