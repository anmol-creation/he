<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindu Encyclopedia</title>
    <meta name="description" content="Eternal History • Sacred Heritage • Historical Truth - The ultimate Hindu Encyclopedia">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="theme-color" content="#FF6B35">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <header>
        <div class="logo">Hindu Encyclopedia</div>
    </header>

    <main>
        <div class="tagline">Eternal History • Sacred Heritage • Historical Truth</div>

        <div class="btn-container">
            <a href="pages/itihas-puran.html" class="nav-btn">Itihas Puran - Timeline</a>
            <a href="hindu-heritage.html" class="nav-btn">Hindu Heritage - Map</a>
            <a href="hindu-archives.html" class="nav-btn">Hindu Archives - Incidents</a>
        </div>

        <button id="installAppBtn" class="nav-btn" style="display: none; margin-top: 2rem; background: var(--primary-saffron); width: 250px;">Install App</button>
    </main>

    <script>
        let deferredPrompt;
        const installAppBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Update UI notify the user they can install the PWA
            installAppBtn.style.display = 'inline-block';
        });

        installAppBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Show the install prompt
                deferredPrompt.prompt();
                // Wait for the user to respond to the prompt
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                // We've used the prompt, and can't use it again, throw it away
                deferredPrompt = null;
                installAppBtn.style.display = 'none';
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>

    <footer>
        © 2026 - Original Research Only
    </footer>

    <script src="js/global.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
